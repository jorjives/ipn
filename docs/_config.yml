title: IPN
description: Insurance Product Notation: an open proposal for declaring insurance product behaviour end to end, with scenarios in the same file.
url: "https://jorjives.github.io"
baseurl: "/ipn"
repository: jorjives/ipn

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-include-cache
  - jekyll-sitemap

permalink: pretty
color_scheme: openidl
logo: ""

exclude:
  - superpowers/
  - .jekyll-cache/
  - .sass-cache/
  - Gemfile
  - Gemfile.lock
  - vendor/

search_enabled: true
search:
  heading_level: 3
  previews: 2
  rel_url: true
  button: false
enable_copy_code_button: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "IPN on GitHub":
    - "https://github.com/jorjives/ipn"
nav_external_links:
  - title: IPN on GitHub
    url: https://github.com/jorjives/ipn
nav_error_report: true

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/jorjives/ipn"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

footer_content: "IPN is licensed under Apache 2.0; the examples and templates are CC0. Every example and template page on this site is generated from a file whose scenarios pass."

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Take care
    color: red
  proof:
    title: Scenarios
    color: green

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

liquid:
  error_mode: strict
  strict_filters: true

compress_html:
  clippings: all
  comments: all
  endings: all
  blanklines: false
  profile: false

sass:
  quiet_deps: true
  silence_deprecations: ['import']
